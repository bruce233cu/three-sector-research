name: Mainline temporary benchmark universe
on:
  push:
    branches: [mainline-phase1e]
    paths: ['scripts/mainline/v221_benchmark_resume.py', '.github/workflows/mainline-v221-universe.yml']
permissions:
  contents: read
  actions: read
jobs:
  universe:
    if: contains(github.event.head_commit.message, '[v221-universe]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-mainline.txt py-mini-racer==0.6.0 pypdf==5.9.0
      - run: PYTHONPATH=src python -m unittest discover -s tests/mainline -p test_historical_universe.py -v
      - uses: actions/download-artifact@v4
        with:
          name: v221-benchmark-universe
          run-id: 36941970099
          github-token: ${{ github.token }}
          path: reports/v221-benchmark-universe/
      - uses: actions/download-artifact@v4
        with:
          name: mainline-v221-real-close
          run-id: 36889897269
          github-token: ${{ github.token }}
          path: .cache/v221-real-close/
      - run: python scripts/mainline/v221_benchmark_resume.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v221-benchmark-universe
          path: reports/v221-benchmark-universe/
          retention-days: 30
