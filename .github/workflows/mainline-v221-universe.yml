name: Mainline temporary benchmark universe
on:
  push:
    branches: [mainline-phase1e]
    paths: ['scripts/mainline/v221_universe_probe.py', '.github/workflows/mainline-v221-universe.yml']
permissions:
  contents: read
  actions: read
jobs:
  universe:
    if: contains(github.event.head_commit.message, '[v221-universe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - uses: actions/download-artifact@v4
        with:
          name: v221-benchmark-universe
          run-id: 36941774366
          github-token: ${{ github.token }}
          path: reports/v221-benchmark-universe/
      - run: python scripts/mainline/v221_universe_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v221-benchmark-universe
          path: reports/v221-benchmark-universe/
          retention-days: 30
