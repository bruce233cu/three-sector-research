name: Mainline Phase 1 CI

on:
  push:
    branches:
      - "mainline-phase1-*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  python-mainline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mainline.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-mainline.txt
      - run: python -m unittest discover -s tests/mainline -p "test_*.py" -v

  node-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json
      - name: Rebuild corrupted baseline lockfile
        if: github.event_name == 'push'
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - run: npm ci --package-lock=true
      - run: npm test
      - name: Commit repaired lockfile
        if: github.event_name == 'push' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix: restore valid package lock"
          git push
