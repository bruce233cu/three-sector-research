name: Mainline Baseline V1 historical blind test
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Run containing persisted mainline-warmup-resume-cache; blank only if no cache exists'
        required: false
        type: string
  push:
    branches: [mainline-phase1e]
    paths: ['scripts/mainline/backtest_restore_warmup.py', '.github/workflows/mainline-blind-warmup.yml']
permissions:
  contents: write
  actions: read
jobs:
  isolated-historical-blind-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[d-warmup]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAINLINE_BLIND_RUN_ID: historical-blind-v1-20261002-full-${{ github.run_id }}
      MAINLINE_BLIND_RESULTS: reports/milestone-d-baseline-v1/runs/historical-blind-v1-20261002-full-${{ github.run_id }}
      MAINLINE_BLIND_WARMUP: reports/milestone-d-baseline-v1/warmup-recovery
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-mainline.txt
      - name: Compile and test the isolated validation contracts
        run: |
          python -m py_compile scripts/mainline/backtest_*.py src/mainline/backtest/*.py
          PYTHONPATH=src python -m unittest discover -s tests/mainline -p 'test_backtest_baseline.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: mainline-state-completion-acquisition
          run-id: 36961627493
          github-token: ${{ github.token }}
          path: temporary_warmup/g3
      - uses: actions/download-artifact@v4
        with:
          name: mainline-production-evidence
          run-id: 36970118460
          github-token: ${{ github.token }}
          path: temporary_warmup/production
      - uses: actions/download-artifact@v4
        with:
          name: v221-benchmark-universe
          run-id: 36942748135
          github-token: ${{ github.token }}
          path: temporary_warmup/universe
      - name: Select existing source evidence only
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('temporary_warmup')
          selected={'g3':['real_fetch_manifest.json','real_input_provenance.json','real_benchmark.json'],
                    'production':['real_memberships.json'], 'universe':['temporary_universe_intervals.json']}
          for name,files in selected.items():
              with zipfile.ZipFile(root/(name+'.zip'),'w',compression=zipfile.ZIP_DEFLATED) as z:
                  for f in files:z.write(root/name/f,arcname=f)
          PY
      - name: Restore successful cache before provider requests
        if: github.event.inputs.resume_run_id != '' && github.event.inputs.resume_run_id != null
        uses: actions/download-artifact@v4
        with:
          name: mainline-warmup-resume-cache
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: temporary_warmup/prices
      - name: Verify classified resume contract
        run: PYTHONPATH=src python -m unittest discover -s tests/mainline -p test_warmup_resume.py -v
      - name: Recover missing warmup with bounded retry of unfinished sources
        run: >-
          python scripts/mainline/backtest_restore_warmup.py
          --g3-zip temporary_warmup/g3.zip
          --production-zip temporary_warmup/production.zip
          --universe-zip temporary_warmup/universe.zip
          --output "$MAINLINE_BLIND_WARMUP"
          --cache temporary_warmup/prices
      - name: Persist temporary cache on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainline-warmup-resume-cache
          path: temporary_warmup/prices/
          retention-days: 30
          if-no-files-found: error
      - name: Full frozen Baseline replay and five complete reruns
        run: >-
          python scripts/mainline/backtest_runner.py
          --run-id "$MAINLINE_BLIND_RUN_ID"
          --output "$MAINLINE_BLIND_RESULTS"
          --warmup-dir "$MAINLINE_BLIND_WARMUP"
      - name: Statistics and nine temporal leakage checks
        run: >-
          python scripts/mainline/backtest_evaluate.py
          --results "$MAINLINE_BLIND_RESULTS"
          --warmup-dir "$MAINLINE_BLIND_WARMUP"
      - name: Compare full warmup and cold start with the same evaluator
        run: >-
          python scripts/mainline/backtest_warmup_diff.py
          --cold reports/milestone-d-baseline-v1/runs/historical-blind-v1-20261002-01
          --full "$MAINLINE_BLIND_RESULTS"
          --output "$MAINLINE_BLIND_RESULTS"
      - name: Baseline report first and candidate list second
        run: python scripts/mainline/backtest_report.py --results "$MAINLINE_BLIND_RESULTS"
      - name: Preserve an honest failed gate if full recovery was impossible
        if: failure()
        run: |
          python scripts/mainline/backtest_report.py --results reports/milestone-d-baseline-v1/runs/historical-blind-v1-20261002-01
          echo "MAINLINE_BLIND_RESULTS=reports/milestone-d-baseline-v1/runs/historical-blind-v1-20261002-01" >> "$GITHUB_ENV"
      - name: Archive only isolated evidence to the authorized branch
        if: always()
        run: |
          test -f "$MAINLINE_BLIND_RESULTS/G5_FINAL_GATE.json" || exit 0
          git config user.name "mainline-validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/milestone-d-baseline-v1
          git diff --cached --quiet && exit 0
          git commit -m "Archive historical blind-test evidence job=${{ github.run_id }}"
          git fetch origin mainline-phase1e
          git merge --no-edit origin/mainline-phase1e
          git push origin HEAD:mainline-phase1e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainline-baseline-blind-test-${{ github.run_id }}
          path: |
            ${{ env.MAINLINE_BLIND_RESULTS }}/
            reports/milestone-d-baseline-v1/warmup-recovery/
          retention-days: 30
