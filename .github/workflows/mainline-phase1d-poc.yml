name: Mainline Phase 1D Real Data POC

on:
  push:
    branches:
      - mainline-phase1d
    paths-ignore:
      - "reports/phase1d/runtime/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mainline-phase1d-poc
  cancel-in-progress: false

jobs:
  real-data-poc:
    if: ${{ !contains(github.event.head_commit.message || '', '[phase1d-data]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainline-phase1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mainline.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-mainline.txt
      - name: Run objective sector POC
        id: poc
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports/phase1d/runtime
          ./scripts/run-mainline-phase1d-poc.sh 2>&1 | tee reports/phase1d/runtime/execution.log
      - name: Record runner failure without inventing data
        if: steps.poc.outcome != 'success'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("reports/phase1d/runtime/runner_failure.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "status": "failed",
              "reason": "real-data POC command failed; inspect execution.log",
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainline-phase1d-poc-${{ github.run_id }}
          path: reports/phase1d/runtime/
          if-no-files-found: error
          retention-days: 30
      - name: Commit compact audit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase1d/runtime
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: record Phase 1D real-data POC [phase1d-data]"
          git push origin HEAD:mainline-phase1d
      - name: Fail workflow when POC failed
        if: steps.poc.outcome != 'success'
        run: exit 1
