name: Mainline Holdout positive range extension

on:
  push:
    branches: [mainline-phase1e]
    paths:
      - scripts/mainline/holdout_positive_range_extend.py
      - .github/workflows/mainline-holdout-positive-extension.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: mainline-holdout-positive-extension
  cancel-in-progress: false

jobs:
  extend:
    if: contains(github.event.head_commit.message, '[holdout-positive-extension]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUTPUT: reports/milestone-e-holdout-data/positive-extension-${{ github.run_id }}
      CACHE: temporary_holdout_positive_extension/provider-cache
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-mainline.txt py-mini-racer==0.6.0
      - name: Verify immutable contracts
        run: |
          python -m py_compile scripts/mainline/holdout_positive_range_extend.py
          test "$(jq -r .candidate_id reports/milestone-d-rule-calibration/v4a_candidate_manifest.json)" = "v4a_calibration_candidate_v1"
          test "$(jq -r .status reports/milestone-e-holdout/holdout_casebook_draft_v2.json)" = "DRAFT_NOT_FROZEN"
          test "$(jq -r .v4a_executed_or_viewed reports/milestone-e-holdout/holdout_casebook_draft_v2.json)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: v221-benchmark-universe
          run-id: 36942748135
          github-token: ${{ github.token }}
          path: temporary_holdout_positive_extension/universe
      - name: Package certified universe
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          source=Path('temporary_holdout_positive_extension/universe')
          with zipfile.ZipFile('temporary_holdout_positive_extension/universe.zip','w',compression=zipfile.ZIP_DEFLATED) as archive:
              for name in ('temporary_universe_intervals.json','source_snapshots.json'):
                  archive.write(source/name,arcname=name)
          PY
      - name: Certify minimal positive extension
        run: >-
          python scripts/mainline/holdout_positive_range_extend.py
          --universe-zip temporary_holdout_positive_extension/universe.zip
          --output "$OUTPUT" --cache "$CACHE"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdout-positive-extension-${{ github.run_id }}
          path: ${{ env.OUTPUT }}/
          retention-days: 90
          if-no-files-found: error
      - name: Archive isolated evidence
        if: always()
        run: |
          test -d "$OUTPUT" || exit 0
          git config user.name "mainline-validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          git diff --cached --quiet && exit 0
          git commit -m "Archive Holdout positive extension job=${{ github.run_id }}"
          git fetch origin mainline-phase1e
          git merge --no-edit origin/mainline-phase1e
          git push origin HEAD:mainline-phase1e
