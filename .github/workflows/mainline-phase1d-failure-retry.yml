name: Mainline Phase 1D Failure-Only Retry

on:
  push:
    branches: [mainline-phase1d]

permissions:
  contents: write

concurrency:
  group: mainline-phase1d-failure-retry
  cancel-in-progress: false

jobs:
  retry-failed-samples:
    if: ${{ contains(github.event.head_commit.message || '', '[phase1d-retry]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample_index: [3, 8, 10]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainline-phase1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mainline.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-mainline.txt
      - name: Run one bounded retry
        id: poc
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          shard_dir="reports/phase1d/retry-shards/${{ matrix.sample_index }}"
          mkdir -p "$shard_dir"
          started_epoch="$(date +%s)"
          printf '%s\n' "$started_epoch" > "$shard_dir/started_epoch.txt"
          timeout --signal=TERM --kill-after=10s 290s \
            env PYTHONPATH="$(pwd)/src" python -m mainline.poc.run_phase1d \
              --sample-index "${{ matrix.sample_index }}" \
              --membership-fallback "reports/phase1d/fallback/sws_official_cached_membership.json" \
              --output-dir "$shard_dir" \
              --cache-dir ".cache/mainline/phase1d-retry/${{ matrix.sample_index }}" \
              2>&1 | tee "$shard_dir/execution.log"
      - name: Record bounded failure
        if: steps.poc.outcome != 'success'
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          folder = Path("reports/phase1d/retry-shards/${{ matrix.sample_index }}")
          started = int((folder / "started_epoch.txt").read_text().strip())
          progress = {}
          if (folder / "progress.json").exists():
              progress = json.loads((folder / "progress.json").read_text())
          (folder / "runner_failure.json").write_text(json.dumps({
              "status": "PARTIAL" if progress else "FAIL",
              "sample_index": ${{ matrix.sample_index }},
              "reason": "bounded retry failed or exceeded 290 seconds; inspect execution.log",
              "duration_seconds": int(time.time()) - started,
              "membership_source_failed": progress.get("membership_source_failed"),
              "membership_source_error": progress.get("membership_source_error"),
              "last_completed_stage": progress.get("stage"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }, ensure_ascii=False, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainline-phase1d-retry-${{ matrix.sample_index }}
          path: reports/phase1d/retry-shards/${{ matrix.sample_index }}/
          if-no-files-found: error
          retention-days: 30

  aggregate-preserved-and-retried:
    if: always() && contains(github.event.head_commit.message || '', '[phase1d-retry]')
    needs: retry-failed-samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mainline-phase1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: mainline-phase1d-retry-*
          path: reports/phase1d/downloaded-retries
      - name: Preserve existing twelve and add successful retries
        run: |
          mkdir -p reports/phase1d/final-input/base
          cp reports/phase1d/runtime/*.json reports/phase1d/final-input/base/
          cp -R reports/phase1d/downloaded-retries/. reports/phase1d/final-input/
          rm -rf reports/phase1d/final
          PYTHONPATH="$(pwd)/src" python -m mainline.poc.aggregate_phase1d \
            --input-dir reports/phase1d/final-input \
            --output-dir reports/phase1d/final \
            --code-commit "$GITHUB_SHA"
          find reports/phase1d/downloaded-retries -name runner_failure.json -print0 | \
            xargs -0 -r python -c 'import json,sys; print(json.dumps([json.load(open(p)) for p in sys.argv[1:]],ensure_ascii=False,indent=2))' \
            > reports/phase1d/final/failed_samples.json
      - uses: actions/upload-artifact@v4
        with:
          name: mainline-phase1d-final-${{ github.run_id }}
          path: reports/phase1d/final/
          retention-days: 30
      - name: Commit final compact audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf reports/phase1d/runtime
          cp -R reports/phase1d/final reports/phase1d/runtime
          git add reports/phase1d/runtime
          git commit -m "data: finalize Phase 1D failure-only retry [phase1d-data]" || exit 0
          git push origin HEAD:mainline-phase1d
