name: Mainline Phase 1D Failure-Only Retry

on:
  push:
    branches: [mainline-phase1d]

permissions:
  contents: write

concurrency:
  group: mainline-phase1d-failure-retry
  cancel-in-progress: false

jobs:
  retry-non-success-samples:
    if: ${{ contains(github.event.head_commit.message || '', '[phase1d-retry]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Preserve the three already-unfrozen successes: 1, 7 and 13.
        sample_index: [0, 2, 3, 4, 5, 6, 8, 9, 10, 11, 12, 14]
    steps:
      - uses: actions/checkout@v4
        with: { ref: mainline-phase1d, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mainline.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-mainline.txt
      - name: Run one bounded sector sample
        id: poc
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          shard="reports/phase1d/retry-shards/${{ matrix.sample_index }}"
          rm -rf "$shard" && mkdir -p "$shard"
          date +%s > "$shard/started_epoch.txt"
          timeout --signal=TERM --kill-after=10s 290s \
            env PYTHONPATH="$(pwd)/src" python -m mainline.poc.run_phase1d \
              --sample-index "${{ matrix.sample_index }}" \
              --membership-fallback reports/phase1d/fallback/sws_official_cached_membership.json \
              --output-dir "$shard" \
              --cache-dir ".cache/mainline/phase1d-retry/${{ matrix.sample_index }}" \
              2>&1 | tee "$shard/execution.log"
      - name: Record bounded failure
        if: steps.poc.outcome != 'success'
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          folder = Path("reports/phase1d/retry-shards/${{ matrix.sample_index }}")
          progress = json.loads((folder / "progress.json").read_text()) if (folder / "progress.json").exists() else {}
          started = int((folder / "started_epoch.txt").read_text().strip())
          (folder / "runner_failure.json").write_text(json.dumps({
            "status": "PARTIAL" if progress else "FAIL",
            "sample_index": ${{ matrix.sample_index }},
            "reason": "sample failed or exceeded the 290-second budget; inspect execution.log",
            "duration_seconds": int(time.time()) - started,
            "last_completed_stage": progress.get("stage"),
            "membership_source_failed": progress.get("membership_source_failed"),
            "membership_source_error": progress.get("membership_source_error"),
            "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
            "commit_sha": os.environ.get("GITHUB_SHA"),
            "recorded_at": datetime.now(timezone.utc).isoformat(),
          }, ensure_ascii=False, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainline-phase1d-retry-${{ matrix.sample_index }}
          path: reports/phase1d/retry-shards/${{ matrix.sample_index }}/
          if-no-files-found: error
          retention-days: 30

  package-retry-results:
    if: always() && contains(github.event.head_commit.message || '', '[phase1d-retry]')
    needs: retry-non-success-samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: mainline-phase1d, fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          pattern: mainline-phase1d-retry-*
          path: reports/phase1d/downloaded-retries
      - uses: actions/upload-artifact@v4
        with:
          name: mainline-phase1d-retries-${{ github.run_id }}
          path: reports/phase1d/downloaded-retries/
          retention-days: 30
